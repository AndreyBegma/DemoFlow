name: flake-219

# Temporary (#219): the 10-consecutive-runs evidence for the log follower fix
# on Windows. Removed before the pull request is ready.

on:
  workflow_dispatch:
  push:
    branches: [fix/219-log-rotation-flake]

permissions:
  contents: read

jobs:
  loop:
    name: flake-219 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the CLI
        run: bun run build --filter=@demoflow/cli

      # A file and the one created after a rename, as the logger rotates it:
      # how often their `number` ino is equal while the bigint ino is not.
      - name: Measure ino precision
        working-directory: ${{ runner.temp }}
        run: |
          node -e '
            const fs = require("node:fs");
            const f = "rot.log";
            let collisions = 0, above = 0, sample = null;
            const runs = 2000;
            for (let i = 0; i < runs; i++) {
              fs.writeFileSync(f, "a");
              const a = fs.statSync(f), ab = fs.statSync(f, { bigint: true });
              fs.renameSync(f, f + ".1");
              fs.writeFileSync(f, "b");
              const b = fs.statSync(f), bb = fs.statSync(f, { bigint: true });
              if (ab.ino > 2n ** 53n) above++;
              if (a.ino === b.ino && ab.ino !== bb.ino) {
                collisions++;
                sample ??= { number: a.ino, old: String(ab.ino), new: String(bb.ino) };
              }
              fs.rmSync(f + ".1");
            }
            console.log(JSON.stringify({ runs, inoAbove2pow53: above, numberInoCollisions: collisions, sample }));
          '

      - name: The rotation test, 10 times
        working-directory: apps/cli
        run: |
          for i in $(seq 1 10); do
            echo "::group::run $i"
            npx vitest run test/runner/files.spec.ts -t "follows it across a rotation" || exit 1
            echo "::endgroup::"
          done
