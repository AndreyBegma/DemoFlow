name: flake-218

# TEMPORARY (#218): evidence on macOS for the waitForReady timing tests.
# Removed before the pull request is ready.

on:
  workflow_dispatch:
  push:
    branches: [fix/218-ready-timing-flake]

permissions:
  contents: read

jobs:
  loop:
    name: flake-218 (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install chromium

      - name: Build
        run: bun run build --filter=@demoflow/engine

      # Both timing tests: "signal sent on load" and "signal sent 500 ms into the step".
      - name: The tests, 10 consecutive runs
        working-directory: packages/engine
        env:
          CI: 'true'
        run: |
          failed=0
          for i in $(seq 1 10); do
            echo "::group::run $i"
            if npx vitest run test/execute/ready.spec.ts -t 'signal sent'; then
              echo "run $i: passed"
            else
              echo "run $i: FAILED"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "failed: $failed of 10"
          test "$failed" -eq 0
