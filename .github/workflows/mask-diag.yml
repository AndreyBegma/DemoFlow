name: mask-diag

# TEMPORARY (#185 diagnosis): removed before the pull request.

# workflow_dispatch needs the file on the default branch, so a push to this
# branch triggers it too.
on:
  push:
    branches: [fix/185-login-mask-frame-leak]
  workflow_dispatch:

permissions:
  contents: read

env:
  # diag: measure the login mask edge; verify: run the mask tests repeatedly.
  MODE: diag
  RUNS: '10'

jobs:
  mask-diag:
    name: mask-diag (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Chromium (Linux, with system libraries)
        if: runner.os == 'Linux'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: bunx playwright install chromium

      - name: Build the execution plane and the fixture
        run: bun run build --filter=@demoflow/cli --filter=@demoflow/fixture

      - name: Measure
        if: env.MODE == 'diag'
        working-directory: packages/renderer
        env:
          DEMOFLOW_MASK_DIAG: '1'
          DEMOFLOW_MASK_DIAG_RUNS: ${{ env.RUNS }}
        run: npx vitest run test/mask/login-edge.diag.spec.ts

      - name: Verify
        if: env.MODE == 'verify'
        run: |
          set -e
          for i in $(seq 1 "$RUNS"); do
            echo "::group::round $i"
            (cd packages/renderer && npx vitest run test/mask test/ffmpeg/render.spec.ts -t "password|mask")
            (cd packages/engine && npx vitest run test/execute/mask.spec.ts test/capture/capture.spec.ts)
            echo "::endgroup::"
          done
