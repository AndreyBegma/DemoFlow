name: package-smoke

# The npm package of `demoflow` as a user gets it (spec #75): the CLI's build
# stages apps/cli/dist/npm, and apps/cli/scripts/smoke.mjs packs that
# directory — the one .woodpecker/release.yml publishes — installs the tarball
# into an empty directory with npm and runs the installed bin, on Linux, macOS
# and Windows, on Node 22 (the package's `engines` floor). With --browsers it
# also starts from an empty PLAYWRIGHT_BROWSERS_PATH: `demoflow run` installs
# Chromium and renders the fixture's customers scenario, `demoflow setup`
# installs it on its own.

on:
  pull_request:
    paths: &paths
      - packages/core/**
      - packages/engine/**
      - packages/renderer/**
      - packages/playwright/**
      - apps/cli/**
      - apps/fixture/**
      - package.json
      - bun.lock
      - scripts/release/**
      - .woodpecker/release.yml
      - .github/workflows/package-smoke.yml
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: package-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The build runs on Node 24 (stage.ts is TypeScript run by Node).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the CLI package and the fixture
        run: bun run build --filter=@demoflow/cli --filter=@demoflow/fixture

      - name: Release script tests
        if: runner.os == 'Linux'
        run: bun run test:release

      # System libraries only: the browser itself must come from `demoflow run`.
      - name: Chromium system libraries
        if: runner.os == 'Linux'
        run: bunx playwright install-deps chromium

      # `demoflow record` (spec #79) opens headed windows: Linux gets a virtual
      # display, macOS and Windows have their own. DEMOFLOW_RECORD_HEADED makes
      # the tests fail rather than fall back to headless. The browser goes to
      # Playwright's default cache, not the smoke test's empty one.
      - name: Chromium for the record tests
        run: bunx playwright install chromium

      - name: Record tests (headed)
        working-directory: apps/cli
        env:
          DEMOFLOW_RECORD_HEADED: '1'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
            xvfb-run -a npx vitest run test/record
          else
            npx vitest run test/record
          fi

      - name: Start the fixture preview
        run: node .github/scripts/serve-fixture.mjs start

      # The installed package runs on the `engines` floor: Node 22, the first
      # with a built-in WebSocket client (spec 151, Decision 4).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Smoke-test the packed tarball
        run: node apps/cli/scripts/smoke.mjs --browsers

      - name: Stop the fixture preview
        if: always()
        run: node .github/scripts/serve-fixture.mjs stop
