# DemoFlow CI and staging — modelled on AgentDock's pipeline.
#
# `check` (Biome) and `build` run in full on every pipeline. `test` depends on
# the event:
#   - pull request: only the packages changed since the merge base with the
#     target branch, plus their dependents (turbo `--filter=...[base]`). The
#     full suite runs instead when a root file every package depends on
#     changed, or when the merge base cannot be found. The step prints which
#     mode it took.
#   - push to main, manual run: the full suite.
#   - push to develop: no tests. The pull request already ran them.
# A pull request that changes only docs (docs/**, *.md, .github/**) skips
# `build` and `test`. `check` still runs, so it still reports a status.
#
# A push to develop then builds the staging images on the agent host's Docker
# daemon and replaces the containers of /home/archi/stacks/demoflow-staging
# (https://demoflow-app.luna-realm.com). No registry, no ssh: the agents
# run on the staging host, and the steps that need it get the Docker socket.
#
# `test` and `test-pr` run turbo with --concurrency=2, like `build`. Unbounded,
# turbo ran up to 10 test tasks at once, each with its own jest or vitest
# worker pool plus Chromium and Postgres, and the kernel SIGKILLed test
# processes on the shared 61 GB agent host (#242). The bound is a guess, not a
# measurement: raise it only after a forced full run passes at the higher value.
#
# The CI Postgres holds throwaway data. It runs on tmpfs, with fsync,
# synchronous_commit and full_page_writes off.
#
# A pull request runs the code of its branch with whatever this file grants,
# so a step that can run on a pull request gets no Docker socket and no host
# volume (ADR-0011):
#   - `ci-image`, `build-staging` and `deploy-staging` mount the socket and run
#     on push and manual events only. A pull request runs on the
#     demoflow-ci:node-bun image the last push or manual run built on the
#     agent host; a change to deploy/ci-image/ reaches pull requests once it is
#     merged. On an agent that has never built the tag the pull request fails
#     at image pull (docker.io/library/demoflow-ci does not exist) — a manual
#     run on develop builds it. Not pinned by digest: the image never leaves
#     the host, and a local image has no repository digest.
#   - `install`, `build` and `test` exist twice. The push/manual steps mount
#     the host caches under /home/archi/ci-cache/demoflow, as before. The
#     `-pr` steps mount nothing: bun's install cache lives in the step's
#     container, turbo's cache (.turbo/cache) and Chromium
#     (PLAYWRIGHT_BROWSERS_PATH=0, inside node_modules) in the pipeline's
#     workspace, and all of it dies with the pipeline. Nothing a pull request
#     writes is read by another pipeline — a later pull request's turbo cache
#     replay, a push build or the staging deploy in particular. Pull requests
#     pay for it: a cold bun install, a full turbo build and a Chromium
#     download every run.
#
# The repository is public. The socket, staging and cache mounts and the
# postgres tmpfs need it "trusted → volumes" in Woodpecker, and pull requests
# from forks must wait for approval (require_approval: forks). Woodpecker
# reads this file from the pull request's own branch, so a same-repository
# pull request that edits it could still mount the socket: only forks wait
# for approval. deploy/README.md lists the repository settings.
when:
  - event: pull_request
  - event: push
    branch: [develop, main]
  - event: manual

variables:
  - &ci_image demoflow-ci:node-bun
  - &docker_image docker:28-cli
  - &socket
    - /var/run/docker.sock:/var/run/docker.sock
  # The stack directory at the host's own path, so the compose file's relative
  # paths mean the same thing inside the step as they do to the daemon.
  - &socket_and_staging
    - /var/run/docker.sock:/var/run/docker.sock
    - /home/archi/stacks/demoflow-staging:/home/archi/stacks/demoflow-staging
  # Caches that outlive a run: the workspace volume dies with the pipeline.
  - &caches
    - /home/archi/ci-cache/demoflow/bun:/ci-cache/bun
    - /home/archi/ci-cache/demoflow/turbo:/ci-cache/turbo
    - /home/archi/ci-cache/demoflow/playwright:/ci-cache/playwright
  - &cache_env
    BUN_INSTALL_CACHE_DIR: /ci-cache/bun
    PLAYWRIGHT_BROWSERS_PATH: /ci-cache/playwright
    TURBO_CACHE_DIR: /ci-cache/turbo
    TURBO_TELEMETRY_DISABLED: '1'
  # Pull requests: no host cache. Chromium goes into node_modules (`0`), turbo
  # uses its default .turbo/cache, bun its in-container cache — all of it in
  # the pipeline's workspace or the step's container, gone with the pipeline.
  - &pr_env
    PLAYWRIGHT_BROWSERS_PATH: '0'
    TURBO_TELEMETRY_DISABLED: '1'
  # A pull request that touches only these skips `build` and `test`.
  - &docs_only
    exclude: ['docs/**', '**/*.md', '.github/**']

services:
  # Throwaway data: no durability. tmpfs is an undocumented step/service field
  # in Woodpecker 3.x, mapped to the docker backend's HostConfig.Tmpfs. It
  # needs "trusted → volumes", like the host mounts below.
  - name: postgres
    image: postgres:16.5-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: demoflow
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    commands:
      - docker-entrypoint.sh postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off

steps:
  # Never on a pull request: the socket is root on the host (ADR-0011).
  - name: ci-image
    image: *docker_image
    when:
      - event: [push, manual]
    volumes: *socket
    commands:
      - docker build -t demoflow-ci:node-bun deploy/ci-image

  # Push and manual: the host caches.
  - name: install
    image: *ci_image
    depends_on: [ci-image]
    when:
      - event: [push, manual]
    volumes: *caches
    environment: *cache_env
    commands: &install_commands
      - bun --version
      - bun install --frozen-lockfile
      - bun run db:generate
      # The Chromium build for the repository's own `playwright`, cached under
      # /ci-cache. System libraries are already in the CI image. Skipped while
      # no workspace depends on playwright.
      - |
        if [ -x node_modules/.bin/playwright ]; then
          bunx playwright install chromium
        else
          echo "playwright not installed: skipping the Chromium install"
        fi

  # Pull request: the image the last push built, no host mount.
  - name: install-pr
    image: *ci_image
    when:
      - event: pull_request
    environment: *pr_env
    commands: *install_commands

  - name: check
    image: *ci_image
    depends_on:
      - { name: install, optional: true }
      - { name: install-pr, optional: true }
    commands:
      - bun run check

  # `next build` type-checks the web app; `nest build` the API.
  - name: build
    image: *ci_image
    depends_on: [install]
    when:
      - event: [push, manual]
    volumes: *caches
    environment: *cache_env
    commands: &build_commands
      - bun run build -- --concurrency=2

  - name: build-pr
    image: *ci_image
    depends_on: [install-pr]
    when:
      - event: pull_request
        path: *docs_only
    environment: *pr_env
    commands: *build_commands

  # `$$` keeps a variable from Woodpecker's own substitution, so the shell
  # expands it.
  - name: test
    image: *ci_image
    depends_on: [build]
    when:
      - event: push
        branch: main
      - event: manual
    volumes: *caches
    environment:
      <<: *cache_env
      TEST_DATABASE_URL: postgresql://postgres:ci@postgres:5432/demoflow_test?schema=public
      DATABASE_URL: postgresql://postgres:ci@postgres:5432/demoflow?schema=public
      APP_ENV: test
    commands: &test_commands
      - until node -e "require('net').connect(5432,'postgres').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; do sleep 1; done
      # A shallow clone has no merge base: fetch the target branch's history
      # (commits only, no trees). Any failure means the full suite, never none.
      - |
        FILTER=""
        if [ "$${CI_PIPELINE_EVENT}" = pull_request ]; then
          TARGET="$${CI_COMMIT_TARGET_BRANCH:-develop}"
          UNSHALLOW=""
          [ "$$(git rev-parse --is-shallow-repository)" = true ] && UNSHALLOW=--unshallow
          if git fetch --no-tags --quiet $${UNSHALLOW} --filter=tree:0 origin "+refs/heads/$${TARGET}:refs/remotes/origin/$${TARGET}" \
            && BASE="$$(git merge-base HEAD "origin/$${TARGET}")"; then
            ROOT="$$(git diff --name-only "$${BASE}" HEAD | grep -E '^(package\.json|bun\.lock|turbo\.json|tsconfig\.json|biome\.json|\.woodpecker/|deploy/ci-image/)' || true)"
            if [ -n "$${ROOT}" ]; then
              echo "test mode: full (root files changed since $${BASE}:" $${ROOT} ")"
            else
              FILTER="--filter=...[$${BASE}]"
              echo "test mode: affected (packages changed since merge base $${BASE} with origin/$${TARGET}, and their dependents)"
            fi
          else
            echo "test mode: full (no merge base with origin/$${TARGET})"
          fi
        else
          echo "test mode: full ($${CI_PIPELINE_EVENT} event)"
        fi
        bun run test -- --concurrency=2 $${FILTER}

  - name: test-pr
    image: *ci_image
    depends_on: [build-pr]
    when:
      - event: pull_request
        path: *docs_only
    environment:
      <<: *pr_env
      TEST_DATABASE_URL: postgresql://postgres:ci@postgres:5432/demoflow_test?schema=public
      DATABASE_URL: postgresql://postgres:ci@postgres:5432/demoflow?schema=public
      APP_ENV: test
    commands: *test_commands

  # On a push to develop `test` is filtered out and the optional dependency is
  # dropped. On a manual run, the deploy waits for the full suite.
  - name: build-staging
    image: *docker_image
    depends_on: [check, build, { name: test, optional: true }]
    when:
      - event: push
        branch: develop
      - event: manual
        branch: develop
    volumes: *socket
    commands:
      - sh deploy/staging/build-staging.sh

  - name: deploy-staging
    image: *docker_image
    depends_on: [build-staging]
    when:
      - event: push
        branch: develop
      - event: manual
        branch: develop
    volumes: *socket_and_staging
    commands:
      - sh deploy/staging/refresh.sh
