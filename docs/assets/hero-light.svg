<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="A JSON scenario becomes a verified browser run, then a polished demo video">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e4f"/><stop offset="1" stop-color="#2b86c5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#656d76"/>
    </marker>
  </defs>
  <rect width="1200" height="400" rx="16" fill="#ffffff"/>

  <!-- 1. Scenario -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" xml:space="preserve">
    <rect x="40" y="70" width="320" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="64" y="100" fill="#656d76" font-size="13">demoflow/customers.demo.json</text>
    <text x="64" y="128" fill="#656d76">{</text>
    <text x="82" y="152"><tspan fill="#0550ae">"name": </tspan><tspan fill="#0a3069">"Create a customer",</tspan></text>
    <text x="82" y="176" fill="#656d76">"steps": [</text>
    <text x="100" y="200"><tspan fill="#0550ae">{ "action": </tspan><tspan fill="#0a3069">"click" },</tspan></text>
    <text x="100" y="224"><tspan fill="#0550ae">{ "action": </tspan><tspan fill="#0a3069">"fill" },</tspan></text>
    <text x="100" y="248"><tspan fill="#0550ae">{ "action": </tspan><tspan fill="#0a3069">"assertText" }</tspan></text>
    <text x="82" y="272" fill="#656d76">]</text>
    <text x="64" y="296" fill="#656d76">}</text>
  </g>
  <text x="200" y="364" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Scenario</text>

  <path d="M372 200 H428" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Verified run -->
  <g>
    <rect x="440" y="70" width="320" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="464" cy="92" r="5" fill="#d8dee4"/><circle cx="482" cy="92" r="5" fill="#d8dee4"/><circle cx="500" cy="92" r="5" fill="#d8dee4"/>
    <rect x="456" y="110" width="288" height="148" rx="6" fill="#ffffff" stroke="#d8dee4"/>
    <rect x="472" y="126" width="120" height="12" rx="3" fill="#d8dee4"/>
    <rect x="472" y="150" width="256" height="10" rx="3" fill="#d8dee4"/>
    <rect x="472" y="168" width="220" height="10" rx="3" fill="#d8dee4"/>
    <rect x="472" y="196" width="104" height="30" rx="6" fill="#2b86c5"/>
    <circle cx="560" cy="218" r="16" fill="none" stroke="#2b86c5" stroke-width="2" opacity="0.6"/>
    <path d="M560 216 l0 22 l6 -6 l5 10 l4 -2 l-5 -10 l8 0 z" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"/>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      <circle cx="468" cy="284" r="9" fill="#1a7f37"/>
      <path d="M463 284 l3.5 3.5 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="486" y="289" fill="#1f2328">assertText passed</text>
      <text x="486" y="312" fill="#656d76">secrets masked · timeline recorded</text>
    </g>
  </g>
  <text x="600" y="364" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Verified run in Chromium</text>

  <path d="M772 200 H828" stroke="#656d76" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Polished video -->
  <g>
    <rect x="840" y="70" width="320" height="260" rx="12" fill="url(#ocean)"/>
    <rect x="868" y="96" width="264" height="168" rx="10" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="884" y="114" width="96" height="10" rx="3" fill="#d8dee4"/>
    <rect x="884" y="134" width="224" height="8" rx="3" fill="#d8dee4"/>
    <rect x="884" y="150" width="190" height="8" rx="3" fill="#d8dee4"/>
    <rect x="884" y="176" width="90" height="26" rx="6" fill="#2b86c5"/>
    <path d="M960 190 l0 20 l5 -5 l5 9 l4 -2 l-5 -9 l7 0 z" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="910" y="230" width="180" height="24" rx="6" fill="#000" opacity="0.7"/>
    <text x="1000" y="247" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#fff">Create the customer</text>
    <rect x="868" y="290" width="264" height="4" rx="2" fill="#ffffff" opacity="0.35"/>
    <rect x="868" y="290" width="150" height="4" rx="2" fill="#ffffff"/>
    <text x="1132" y="314" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ffffff" opacity="0.85">ffmpeg.mp4</text>
  </g>
  <text x="1000" y="364" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Polished demo video</text>

  <text x="600" y="40" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#656d76">one JSON file → a checked run → an MP4 with cursor, zoom, captions and masked secrets</text>
</svg>
